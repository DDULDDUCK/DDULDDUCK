name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # 매일 자정 실행
  workflow_dispatch: # 수동 실행 버튼
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 1. 뱀 애니메이션 생성
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 스탯 카드 생성 (추가된 부분)
      - name: generate-github-profile-summary-cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # 생성된 파일을 dist 폴더 안의 stats 폴더로 옮깁니다.
          BRANCH: main 

      # 스탯 카드 파일들을 dist 폴더로 이동 (배포를 위해)
      - name: Move stats to dist
        run: |
          mkdir -p dist/stats
          cp -r profile-summary-cards-output/tokyonight/* dist/stats/

      # 3. 모든 결과물(뱀 + 스탯)을 output 브랜치에 한 번에 업로드
      - name: push all assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
